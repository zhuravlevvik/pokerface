<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokerface — просмотр политик</title>
    <link rel="stylesheet" href="/static.css">
  </head>
  <body>
    <header>
      <h1>Pokerface <small>просмотр checkpoint vs bot</small></h1>
      <div class="controls">
        <label>Режим <select id="mode"><option value="player">игрок</option><option value="spectator">наблюдатель</option></select></label>
        <label>Игроков <select id="player-count"><option value="2">2 (HU)</option><option value="3">3-max</option><option value="5" selected>5-max</option></select></label>
        <label>Герой <select id="hero"></select></label>
        <label>Раздач <input id="hands" type="number" min="1" max="1000" value="1"></label>
        <label>Seed <input id="seed" type="number" placeholder="случайный"></label>
        <button id="start">Запустить</button>
        <button id="pause" disabled>Пауза</button>
        <button id="step" disabled>Следующий ход</button>
        <button id="next-hand" disabled>Следующая раздача</button>
        <label>Скорость <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
        <button id="download" disabled>Скачать replay</button>
        <label class="file">Импорт replay <input id="replay-file" type="file" accept="application/json"></label>
      </div>
      <div id="seat-controls" class="seat-controls" aria-label="Политика на каждом месте"></div>
      <p id="status" aria-live="polite">Соединение…</p>
    </header>
    <main>
      <section class="table-panel" aria-label="Покерный стол">
        <div id="table" class="table">
          <div class="pot">Банк <strong id="pot">—</strong><span id="street">—</span></div>
          <div id="board" class="board" aria-label="Общие карты"></div>
          <div id="seats"></div>
        </div>
      </section>
      <aside class="inspector">
        <section>
          <h2>Решение модели</h2>
          <p id="selected-action">Ожидание действия</p>
          <dl><dt>Value</dt><dd id="value">—</dd><dt>Equity</dt><dd id="equity">—</dd></dl>
          <h3>Действия</h3><div id="action-probs" class="bars"></div>
          <h3>Размер рейза</h3><div id="size-probs" class="bars"></div>
        </section>
        <section>
          <h2>Equity героя</h2>
          <svg id="equity-graph" viewBox="0 0 320 130" role="img" aria-label="График equity"></svg>
          <div id="equity-labels" class="muted"></div>
        </section>
        <section><h2>История действий</h2><ol id="history"></ol></section>
        <section><h2>Серия</h2><div id="series-summary" class="muted">Нет запущенной серии</div></section>
      </aside>
    </main>
    <template id="seat-template"><article class="seat"><b class="position"></b><span class="chips"></span><div class="cards"></div><small class="state"></small></article></template>
    <script src="/app.js"></script>
  </body>
</html>
