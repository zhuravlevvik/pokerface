[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerface"
version = "0.1.0"
description = "Deterministic no-limit Texas Hold'em engine"
requires-python = ">=3.11"

[project.scripts]
pokerface-train = "poker.train_cli:main"
pokerface-watch = "poker.watch:main"

[project.optional-dependencies]
rl = ["torch>=2.2"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["poker*"]

[tool.setuptools.package-data]
poker = ["static/*.html", "static/*.css", "static/*.js"]
